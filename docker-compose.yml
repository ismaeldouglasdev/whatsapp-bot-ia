version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5433"
    command: postgres -c listen_addresses='*' -p 5433
    networks:
      - evolution_net

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    command: redis-server --port 6380 --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6380:6380"
    networks:
      - evolution_net

  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - minio
    env_file:
      - .env
    ports:
      - "8083:8083"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_net

  minio:
    image: minio/minio:latest
    container_name: evolution_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evolution
      MINIO_ROOT_PASSWORD: evolution2026
    ports:
      - "9000:9000"
    volumes:
      - /mnt/data/minio-data:/data
    networks:
      - evolution_net

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  evolution_net:
    driver: bridge